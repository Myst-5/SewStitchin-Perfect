<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilt Photo Slideshow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #3f2f4a; /* Matches site theme */
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 85%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #1a1220;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            object-fit: contain;
        }
        .slide.active { opacity: 1; }
        .caption {
            margin-top: 12px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: #d8c9ed; /* Soft lavender text */
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <img src="Quilt Photos.jpg" class="slide active" alt="Quilt Photo">
        <img src="Quilt Photos-3.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos-4.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos-5.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos_1.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos_2.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos_3.jpg" class="slide" alt="Quilt Photo">
        <img src="Quilt Photos_3-2.jpg" class="slide" alt="Quilt Photo">
    </div>
    <div class="caption" id="caption">Quilt 1 of 8</div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const caption = document.getElementById('caption');
        let currentIndex = 0;
        const slideInterval = 4000;

        function nextSlide() {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
            caption.textContent = `Quilt ${currentIndex + 1} of ${slides.length}`;
        }

        setInterval(nextSlide, slideInterval);
    </script>
</body>
</html>
